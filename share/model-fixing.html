<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기체 시뮬레이터 프로젝트 — 바이브코딩</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#eef4f9; --paper-hi:#f9fcfe; --paper-lo:#d9e6f0;
 --line:#9db7cc; --line-soft:#c3d5e2;
 --ink:#1e2c39; --ink-dim:#41586c; --ink-mute:#7b91a4;
 --accent:#20748f; --sky:#3f88c5; --sky-hi:#a9d0ef; --sky-dk:#1c507e;
 --c1:#b23a30; --c2:#3f64b5; --c3:#c4711e; --c4:#3a7a3f; --c5:#7d5ba6;
 --ok:#2c7a44; --danger:#b3362e; --gold:#c4711e;
 --disp:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
 --mono:"JetBrains Mono",ui-monospace,monospace; --jua:"Jua",var(--disp);
 --r:14px; --shadow:0 14px 38px -20px rgba(23,52,80,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--disp);color:var(--ink);line-height:1.68;font-size:16.5px;
     word-break:keep-all;overflow-wrap:break-word;
     background:var(--paper) linear-gradient(180deg,#e3eef7 0%,var(--paper) 320px)}
.wrap{max-width:920px;margin:0 auto;padding:0 16px 40px}

/* ── 머리 ── */
header.top{position:sticky;top:0;z-index:30;background:rgba(240,246,251,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft)}
.topin{max-width:920px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--jua);font-size:18px;color:var(--sky-dk);line-height:1.15;white-space:nowrap}
.brand small{display:block;font-family:var(--disp);font-size:11.5px;color:var(--ink-mute);font-weight:400}
.spacer{flex:1}
.prog{display:flex;align-items:center;gap:7px;min-width:132px}
.prog .track{flex:1;height:8px;background:var(--paper-lo);border-radius:5px;overflow:hidden}
.prog .track i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.prog .pct{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--accent);min-width:34px;text-align:right}
.hbtn{font:inherit;font-size:16px;padding:5px 9px;border:1px solid var(--line);border-radius:9px;
  background:var(--paper-hi);cursor:pointer;line-height:1}
.hbtn.on{background:var(--accent);border-color:var(--accent)}

nav.tabs{display:flex;gap:6px;overflow-x:auto;max-width:920px;margin:0 auto;padding:8px 16px 0}
nav.tabs button{flex:none;font:inherit;font-weight:700;font-size:14.5px;color:var(--ink-dim);
  background:transparent;border:1px solid transparent;border-radius:11px 11px 0 0;
  padding:8px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{background:rgba(255,255,255,.6)}
nav.tabs button.on{background:var(--paper-hi);border-color:var(--line-soft);border-bottom-color:var(--paper-hi);
  color:var(--accent);box-shadow:0 -3px 0 var(--accent) inset}

/* ── 공통 ── */
section.tab{display:none;animation:fade .22s ease}
section.tab.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
h2{font-family:var(--jua);font-size:clamp(21px,3.3vw,27px);color:var(--sky-dk);margin:30px 0 10px;font-weight:400}
h3{font-family:var(--jua);font-size:18.5px;color:var(--accent);margin:22px 0 8px;font-weight:400}
p{margin:0 0 12px}
.card{background:var(--paper-hi);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:18px 20px;margin:14px 0;box-shadow:var(--shadow)}
.lead{font-size:17.5px;color:var(--ink-dim)}
.pill{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;
  background:var(--accent);padding:3px 10px;border-radius:20px;letter-spacing:.3px}
.pill.m1{background:var(--c1)} .pill.m2{background:var(--c2)} .pill.m3{background:var(--c3)}
b.kw{color:var(--c1)} b.kv{color:var(--c2)} b.kt{color:var(--c3)} b.kp{color:var(--c4)}
code{font-family:var(--mono);font-size:.92em;background:#e7eff6;padding:1px 6px;border-radius:5px;color:var(--sky-dk)}
pre{font-family:var(--mono);font-size:13px;line-height:1.6;background:#1e2c39;color:#dbe7f0;
  padding:12px 14px;border-radius:10px;overflow-x:auto;margin:8px 0}
pre .del{color:#f4a2a2} pre .add{color:#a8e0b4}
ul,ol{margin:0 0 12px;padding-left:1.3em} li{margin-bottom:5px}
.btn{font:inherit;font-weight:700;font-size:14.5px;padding:9px 16px;border:1px solid var(--line);
  border-radius:10px;background:var(--paper-hi);color:var(--ink);cursor:pointer}
.btn:hover{background:#e9f2fa}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#1a6079}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

/* ── 시뮬 틀 ── */
.simbox{border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;background:#fff;margin:6px 0}
.simbox iframe{display:block;width:100%;height:660px;border:0}
.simbox .cap{padding:7px 13px;background:var(--paper-lo);font-size:13px;color:var(--ink-dim);
  border-bottom:1px solid var(--line-soft)}

/* ── 결함 카드 ── */
.bug{border:1px solid var(--line-soft);border-left:5px solid var(--c1);border-radius:11px;
  background:var(--paper-hi);margin:10px 0;overflow:hidden}
.bug.done{border-left-color:var(--ok);background:#f2f9f4}
.bug > .head{display:flex;align-items:center;gap:11px;padding:12px 15px;cursor:pointer;user-select:none}
.bug .no{font-family:var(--jua);font-size:16px;color:var(--c1);min-width:64px}
.bug.done .no{color:var(--ok)}
.bug .ttl{flex:1;font-weight:700;font-size:15.5px;color:var(--ink-mute)}
.bug.done .ttl{color:var(--ink)}
.bug .chk{width:22px;height:22px;accent-color:var(--ok);cursor:pointer;flex:none}
.bug .body{display:none;padding:2px 15px 15px;border-top:1px dashed var(--line-soft)}
.bug.open .body{display:block}
.hint{margin:9px 0;border:1px solid var(--line-soft);border-radius:9px;background:#fff}
.hint > summary{cursor:pointer;padding:9px 13px;font-weight:700;font-size:14.5px;color:var(--accent);list-style:none}
.hint > summary::-webkit-details-marker{display:none}
.hint > summary::before{content:"▸ ";color:var(--sky)}
.hint[open] > summary::before{content:"▾ "}
.hint .in{padding:2px 15px 13px;font-size:15.5px;color:var(--ink-dim)}
.hint.ans{border-color:#c8b48a;background:#fdfaf3}
.hint.ans > summary{color:var(--gold)}
.why{margin-top:8px;padding:10px 13px;background:#eef5ef;border-left:3px solid var(--c4);
  border-radius:0 8px 8px 0;font-size:15px}
.why b{color:var(--c4)}

/* ── 교사용 ── */
.tonly{display:none}
body.tmode .tonly{display:block}
.tbox{border:1px dashed var(--c5);background:#f7f3fb;border-radius:10px;padding:12px 15px;margin:10px 0}
.tbox .tag{font-family:var(--mono);font-size:11.5px;font-weight:700;color:#fff;background:var(--c5);
  padding:2px 9px;border-radius:20px}

/* ── 경고 상자 ── */
.warn{border:1px solid #dcb88c;border-left:5px solid var(--c3);background:#fdf7ee;
  border-radius:11px;padding:13px 16px;margin:12px 0;font-size:15.5px;line-height:1.66}
.warn .h{display:block;font-family:var(--jua);font-size:16.5px;color:var(--c3);margin-bottom:4px}
.warn .test{display:block;margin:7px 0;padding:9px 13px;background:#fff;
  border:1px solid #e3cba7;border-radius:9px;font-weight:700}

/* ── 프롬프트 ── */
.pcard{background:#fff;border:1px solid var(--line-soft);border-radius:11px;padding:14px 16px;margin:9px 0}
.pcard.good{border-left:5px solid var(--ok)}
.pcard.bad{border-left:5px solid var(--danger);opacity:.92}
.pcard .lbl{font-weight:700;font-size:13.5px;margin-bottom:5px}
.pcard.good .lbl{color:var(--ok)} .pcard.bad .lbl{color:var(--danger)}
.pcard .txt{font-size:15.5px;line-height:1.7}
.ptmpl{position:relative}
.ptmpl .copy{position:absolute;top:10px;right:10px}

/* ── 실행실 ── */
.lab{border:2px solid var(--sky);border-radius:var(--r);background:#f4faff;padding:15px 17px;margin:14px 0}
.lab h4{font-family:var(--jua);font-size:17px;color:var(--sky-dk);margin:0 0 6px;font-weight:400}
.lab textarea{width:100%;height:130px;font-family:var(--mono);font-size:12.5px;line-height:1.55;
  padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);resize:vertical}
.lab .note{font-size:13.5px;color:var(--ink-dim);margin:6px 0 0}

/* ── 새 흐름 ── */
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
h4.way{font-family:var(--jua);font-size:18px;color:var(--accent);margin:0 0 6px;font-weight:400}
.hint.fix{border-color:#9fc3a6;background:#f3faf4} .hint.fix > summary{color:var(--c4)}
.hint pre{margin:6px 0 0}
.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:10px 0}
figure.shot{margin:0;background:var(--paper-hi);border:1px solid var(--line-soft);border-radius:12px;overflow:hidden}
figure.shot img{display:block;width:100%;height:auto;border-bottom:1px solid var(--line-soft)}
figure.shot figcaption{padding:9px 12px;font-size:14.5px;line-height:1.55}
figure.shot figcaption .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;margin-right:4px}
.sgh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}
.sgh span{font-size:14.5px;color:var(--ink-dim)}
a.btn{text-decoration:none;display:inline-block}
.cycle{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 10px;font-size:14.5px;color:var(--ink-mute)}
.cycle span,.goal5 span{background:#e7f1f8;color:var(--sky-dk);font-weight:700;padding:5px 11px;border-radius:20px;font-size:14.5px}
.goal5{display:flex;flex-wrap:wrap;gap:6px}
ol.rules li{margin-bottom:6px}
.mq{background:var(--paper-hi);border:1px solid var(--line-soft);border-radius:12px;padding:12px 15px;margin:10px 0}
.mq > p{margin:0 0 8px}
.mqc{display:flex;flex-direction:column;gap:6px}
.mqc button{font:inherit;font-size:15px;text-align:left;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 12px;cursor:pointer}
.mqc button.ok{background:#e3f4e8;border-color:var(--ok)} .mqc button.no{background:#fbe7e5;border-color:var(--danger)}
.mqw{display:none;margin:8px 0 0 !important;padding:8px 12px;background:#eef5ef;border-left:3px solid var(--c4);border-radius:0 8px 8px 0;font-size:15px}
.mq.done .mqw{display:block}
table.mini{font-size:13.5px;margin:8px 0} table.mini td,table.mini th{padding:6px 8px}
@media(max-width:760px){ .two,.steps{grid-template-columns:1fr} }

/* ── 잠금(열린 단계) ── */
.lockcard{display:none;border:2px dashed var(--c5);background:#f7f3fb;border-radius:var(--r);padding:16px 18px;margin:14px 0;font-size:16px}
.lockcard b{color:var(--c5)}
section.tab.locked > .lockcard{display:block}
body:not(.tmode) section.tab.locked > :not(.lockcard){display:none}
.lockcard .tnote{display:none;font-size:14px;color:var(--ink-dim);margin-top:6px}
body.tmode .lockcard .tnote{display:block}
.stagepick button.lk{opacity:.6}

/* ── ⓐ 말하기 순서 ── */
ol.say{font-size:15px;margin:0 0 10px;padding-left:1.35em}
ol.say li{margin-bottom:5px}
ol.say .ent{color:var(--danger);font-weight:700}

/* ── 잘못 찾기: 적고 → 공개 ── */
.findbox{border:2px solid var(--sky);background:#f4faff}
.findbox ol.finds{margin:6px 0 4px;padding-left:1.4em}
.findbox ol.finds li{margin-bottom:8px}
.findbox textarea,.thinkq textarea{display:block;width:100%;font:inherit;font-size:15px;line-height:1.55;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;resize:vertical}
.bugs[hidden]{display:none}
body.tmode .bugs[hidden]{display:block}
.bugs .revealed{font-size:15px;color:var(--ink-dim);margin:12px 0 4px}
.bug .found{display:flex;align-items:center;gap:6px;flex:none;font-size:13.5px;font-weight:700;color:var(--ok);cursor:pointer;white-space:nowrap}
.thinkq .tq{margin-bottom:10px}
.thinkq label{display:block;font-size:15.5px;margin-bottom:4px}
.goalbox,.bugs{scroll-margin-top:130px}

/* ── 먼저 생각해 보기: 조건 적고 → 열기 ── */
.condbox{border:2px solid var(--c3);background:#fffaf2}
.condbox .cq{font-size:17px;font-weight:700;margin:0 0 6px;color:var(--ink)}
.condbox .cq b{color:var(--c3)}
.condbox textarea,.fixbox textarea{display:block;width:100%;font:inherit;font-size:15px;line-height:1.55;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;resize:vertical}
.goallock{border:2px dashed var(--line);background:#f3f7fa;color:var(--ink-dim);box-shadow:none;font-size:15.5px}
.goallock[hidden],.goalbox[hidden]{display:none}
body.tmode .goalbox[hidden]{display:block}
body.tmode .goallock{display:none}

/* ── 3단계: ⓐ 문장+코드 · ⓑ 직접 고치기(프롬프트 만들기) ── */
h4.way small{font-family:var(--disp);font-size:13.5px;color:var(--ink-mute);margin-left:6px}
.pplus{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line-soft);font-size:13px;color:var(--ink-mute)}
.btn small{font-weight:400;font-size:12px;opacity:.85;margin-left:4px}
.fixbox{border:2px solid var(--c4);background:#f6fbf6}
.fixrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line-soft)}
.fixrow:first-child{border-top:0}
.fixrow .inc{flex:none;display:flex;align-items:center;gap:5px;font-size:13.5px;font-weight:700;color:var(--c4);cursor:pointer;margin-top:24px;white-space:nowrap}
.fixrow .inc input{width:19px;height:19px;accent-color:var(--c4);cursor:pointer}
.fixrow .fx{flex:1;min-width:0}
.fixrow .fl{display:block;font-size:13.5px;font-weight:700;color:var(--ink-dim);margin:0 0 3px}
.fixrow .fx textarea + .fl{margin-top:6px}
.fixrow.off .fx{opacity:.45}
.pbuilt{background:#fff;border:1px solid var(--line-soft);border-left:5px solid var(--c4);border-radius:11px;padding:12px 14px;margin:10px 0 0}
.pbuilt .lbl{font-weight:700;font-size:13.5px;color:var(--c4);margin-bottom:4px}
.pbuilt .txt{white-space:pre-line;font-size:14.5px;line-height:1.65}
.pbuilt .txt.empty{color:var(--ink-mute)}

/* ── 실행실: 코드 복사하는 법 ── */
.howcopy{border:1px solid var(--sky-hi);background:#fff;border-radius:11px;padding:10px 14px;margin:0 0 10px}
.howcopy[hidden]{display:none}
.howcopy .fshots{grid-template-columns:repeat(2,1fr)}
@media(max-width:760px){ .howcopy .fshots{grid-template-columns:1fr} }

/* ── 따라 하기 ── */
.nowbar{max-width:920px;margin:0 auto;padding:6px 16px 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nowbar .nb{flex:1 1 220px;font-size:14px;background:#fff6e2;border:1px solid #e9c98a;border-radius:10px;padding:6px 11px;line-height:1.45}
.nowbar .nb b{color:var(--c3)}
.nowbar .btn{padding:6px 11px;font-size:13.5px}
.nowbar[hidden]{display:none}
.rules-card{border:2px solid var(--c3);background:#fff9ef;border-radius:var(--r);padding:15px 18px;margin:14px 0}
.rules-card h3{margin:0 0 8px;color:var(--c3)}
.rules-card ul{margin:0;padding-left:1.1em}
.rules-card li{font-size:15.5px}
.rules-card b.bad{color:var(--danger)}
.stagepick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stagepick button{font:inherit;text-align:left;border:2px solid var(--line-soft);background:var(--paper-hi);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink);line-height:1.35}
.stagepick button b{display:block;font-family:var(--jua);font-weight:400;font-size:17px;color:var(--sky-dk)}
.stagepick button small{display:block;font-size:12.5px;color:var(--ink-mute)}
.stagepick button .pp{display:block;font-size:12px;font-weight:700;color:var(--ok);margin-top:2px;min-height:1em}
.stagepick button.on{border-color:var(--accent);background:#e4f2f6;box-shadow:0 6px 18px -12px rgba(23,52,80,.6)}
.fgoal b{font-family:var(--jua);font-weight:400;font-size:18px;color:var(--accent)}
.fgoal span{font-size:13.5px;color:var(--ink-mute)}
.fstep{border:1px solid var(--line-soft);border-left:6px solid var(--line);border-radius:12px;background:var(--paper-hi);margin:9px 0;overflow:hidden}
.fstep > .fh{display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:pointer;user-select:none}
.fstep .fn{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--paper-lo);color:var(--sky-dk);font-weight:700;font-size:14px}
.fstep .ft{flex:1;font-weight:700;font-size:16px;line-height:1.4}
.fstep .ft small{display:block;font-weight:400;font-size:13px;color:var(--ink-mute)}
.fstep .optag{flex:none;font-size:12px;font-weight:700;color:var(--c5);border:1px solid var(--c5);border-radius:20px;padding:1px 8px}
.fstep .fb{display:none;padding:8px 16px 14px;border-top:1px dashed var(--line-soft)}
.fstep.open .fb{display:block}
.fstep.cur{border-left-color:var(--accent);box-shadow:0 10px 28px -18px rgba(23,52,80,.6)}
.fstep.cur .fn{background:var(--accent);color:#fff}
.fstep.done{border-left-color:var(--ok);background:#f4faf5}
.fstep.done .fn{background:var(--ok);color:#fff}
.fstep.done .ft{color:var(--ink-dim)}
ol.do{margin:4px 0 8px;padding-left:1.3em}
ol.do li{margin-bottom:6px;font-size:15.5px}
.fshots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.fshots figure.shot figcaption{font-size:13px}
.fdone{display:flex;justify-content:flex-end;margin-top:8px}
.fend{border-color:var(--ok);background:#eef8f0;font-weight:700}
.waitcard{border:2px dashed #b49ad3;background:#f8f4fd;border-radius:12px;padding:12px 15px;margin:12px 0}
.waitcard h4{margin:0 0 4px;font-family:var(--jua);font-weight:400;font-size:17px;color:var(--c5)}
.waitcard .rule{margin:0 0 6px;font-weight:700}
.waitcard .rule b{color:var(--danger)}
.waitcard ol{margin:0;padding-left:1.3em}
.waitcard li{font-size:15px}
ul.errl{margin:0;padding-left:1.1em}
ul.errl li{margin-bottom:7px}
@media(max-width:760px){ .stagepick{grid-template-columns:1fr 1fr} .fshots{grid-template-columns:1fr} }

/* ── 확인 목록 ── */
.chks{list-style:none;padding:0;margin:8px 0}
.chks li{display:flex;gap:11px;align-items:flex-start;padding:10px 13px;background:#fff;
  border:1px solid var(--line-soft);border-radius:10px;margin-bottom:7px}
.chks input{width:21px;height:21px;accent-color:var(--ok);cursor:pointer;flex:none;margin-top:2px}
.chks label{flex:1;cursor:pointer;font-size:15.5px}
.chks li.done{background:#f2f9f4;border-color:#b6dcc2}

/* ── 표 ── */
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:15px;background:#fff}
th,td{border:1px solid var(--line-soft);padding:9px 11px;text-align:left;vertical-align:top}
th{background:var(--paper-lo);font-weight:700;color:var(--sky-dk)}
td .num{font-family:var(--mono)}

/* ── 기록장 ── */
.log textarea{width:100%;height:74px;font:inherit;font-size:15px;padding:9px 11px;
  border:1px solid var(--line-soft);border-radius:9px;resize:vertical;background:#fff}
.log .fld{margin-bottom:11px}

&lt;body&gt;
&lt;div class="wrap"&gt;
  &lt;h1&gt;기체 압력 상자&lt;/h1&gt;
  &lt;p class="sub"&gt;상자 안 기체 입자가 벽에 부딪혀 &lt;b&gt;압력&lt;/b&gt;이 생기는 모습을 보여 줍니다.&lt;/p&gt;

  &lt;canvas id="box" width="520" height="360"&gt;&lt;/canvas&gt;

  &lt;div class="panel"&gt;
    &lt;div class="row"&gt;
      &lt;label for="num"&gt;입자 수&lt;/label&gt;
      &lt;input type="range" id="num" min="4" max="60" value="24"&gt;
      &lt;span class="val" id="numVal"&gt;24&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class="row"&gt;
      &lt;button id="play"&gt;⏸ 멈춤&lt;/button&gt;
      &lt;button id="reset"&gt;↺ 다시 뿌리기&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class="reads"&gt;
    &lt;div class="read h"&gt;&lt;span&gt;1초 동안 벽에 부딪힌 횟수&lt;/span&gt;&lt;b id="hitOut"&gt;0&lt;/b&gt;&lt;/div&gt;
    &lt;div class="read p"&gt;&lt;span&gt;기체의 압력&lt;/span&gt;&lt;b id="prsOut"&gt;0&lt;/b&gt;
      &lt;div class="bar"&gt;&lt;i id="prsBar"&gt;&lt;/i&gt;&lt;/div&gt;

&lt;script&gt;
const cv  = document.getElementById('box');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

/* ===== 값 설정 ===== */
const R      = 22;    // 입자 하나의 반지름(픽셀)
const GY     = 0.34;  // 매 프레임 아래쪽으로 더해 주는 속도
const BOUNCE = 0.74;  // 벽에 부딪힌 뒤 남는 속도의 비율
const SPEED  = 2.7;   // 처음 나눠 주는 빠르기

let ps = [];              // 입자 목록
let playing = true;       // 움직이는 중인가
let hitCount = 0;         // 충돌을 센 값
let hitShow  = 0;         // 화면에 보여 줄 1초당 충돌 수
let lastSec  = performance.now();

/* 입자를 상자 안에 뿌린다 */
function makeParticles(n){
  ps = [];
  for(let i=0;i&lt;n;i++){
    const a = Math.random()*Math.PI*2;
    ps.push({
      x: R + Math.random()*(W-2*R),
      y: R + Math.random()*(H-2*R),
      vx: Math.cos(a)*SPEED,
      vy: Math.sin(a)*SPEED
    });
  }
}

/* 입자를 한 걸음 움직인다 */
function step(){
  for(const p of ps){
    p.vy += GY;          // 아래쪽으로 속도를 더한다
    p.x  += p.vx;
    p.y  += p.vy;

    // 벽에 부딪히면 튕겨 나오고, 그 순간에 한 번 센다
    if(p.x &lt; R)     { p.x = R;     p.vx = -p.vx;          hit(p.vx); }   // 왼쪽 벽
    if(p.x &gt; W-R)   { p.x = W-R;   p.vx = -p.vx;          hit(p.vx); }   // 오른쪽 벽
    if(p.y &lt; R)     { p.y = R;     p.vy = -p.vy;          hit(p.vy); }   // 위쪽 벽
    if(p.y &gt; H-R)   { p.y = H-R;   p.vy = -p.vy*BOUNCE;   hit(p.vy); }   // 아래쪽 벽
  }
}

/* 충돌 한 번을 센다 — 튕겨 나오는 빠르기가 거의 0이면(벽에 붙어 있는 것) 세지 않는다 */
function hit(v){
  if(Math.abs(v) &gt; 0.3) hitCount++;
}

/* 기체의 압력을 구한다 — 1초 동안 벽에 부딪힌 횟수에서 */
function pressure(){
  return hitShow * 3;
}

/* 화살표 하나를 그린다 */
function arrow(x1,y1,x2,y2){
  const a = Math.atan2(y2-y1, x2-x1);
  ctx.strokeStyle = '#b23a30'; ctx.fillStyle = '#b23a30'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-9*Math.cos(a-0.42), y2-9*Math.sin(a-0.42));
  ctx.lineTo(x2-9*Math.cos(a+0.42), y2-9*Math.sin(a+0.42));
  ctx.closePath(); ctx.fill();
}

/* 화면을 그린다 */
function draw(){
  ctx.clearRect(0,0,W,H);

  // 상자 안쪽
  ctx.fillStyle = '#f4f9fd'; ctx.fillRect(0,0,W,H);

  // 입자
  for(const p of ps){
    ctx.beginPath(); ctx.arc(p.x,p.y,R,0,Math.PI*2);
    ctx.fillStyle = '#3a7a3f'; ctx.fill();
    ctx.strokeStyle = '#2b5c2f'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  // 기체가 벽을 미는 힘을 화살표로 보여 준다
  for(let i=0;i&lt;5;i++){
    const x = W*(i+1)/6;
    arrow(x, H-34, x, H-8);
  }

  // 상자 테두리
  ctx.strokeStyle = '#1c507e'; ctx.lineWidth = 5;
  ctx.strokeRect(2.5,2.5,W-5,H-5);
}

/* 되풀이해서 실행한다 */
function loop(now){
  if(playing) step();
  draw();

  if(now - lastSec &gt;= 1000){
    hitShow  = hitCount;
    hitCount = 0;
    lastSec  = now;
    document.getElementById('hitOut').textContent = hitShow;
  }
  const pr = pressure();
  document.getElementById('prsOut').textContent = pr.toFixed(0);
  document.getElementById('prsBar').style.width = Math.min(100, pr/1.2) + '%';

  requestAnimationFrame(loop);
}

/* 조작 단추 연결 */
const numEl = document.getElementById('num');
numEl.addEventListener('input', ()=&gt;{
  document.getElementById('numVal').textContent = numEl.value;
  makeParticles(+numEl.value);
});
document.getElementById('play').addEventListener('click', e=&gt;{
  playing = !playing;
  e.target.textContent = playing ? '⏸ 멈춤' : '▶ 움직이기';
});
document.getElementById('reset').addEventListener('click', ()=&gt; makeParticles(+numEl.value));

makeParticles(+numEl.value);
requestAnimationFrame(loop);
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;

&lt;body&gt;
&lt;div class="wrap"&gt;
  &lt;h1&gt;누르는 상자&lt;/h1&gt;
  &lt;p class="sub"&gt;온도가 일정할 때, 오른쪽 벽을 밀어 &lt;b&gt;부피&lt;/b&gt;를 줄이면 기체의 &lt;b&gt;압력&lt;/b&gt;이 어떻게 되는지 보여 줍니다.&lt;/p&gt;

  &lt;canvas id="box" width="520" height="360"&gt;&lt;/canvas&gt;

  &lt;div class="panel"&gt;
    &lt;div class="row"&gt;
      &lt;label for="vol"&gt;부피&lt;/label&gt;
      &lt;input type="range" id="vol" min="35" max="100" value="100"&gt;
      &lt;span class="val" id="volVal"&gt;100%&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class="row"&gt;
      &lt;label for="num"&gt;입자 수&lt;/label&gt;
      &lt;input type="range" id="num" min="0" max="180" value="120"&gt;
      &lt;span class="val" id="numVal"&gt;120&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class="row"&gt;
      &lt;button id="play"&gt;⏸ 멈춤&lt;/button&gt;
      &lt;button id="reset"&gt;↺ 다시 뿌리기&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class="reads"&gt;
    &lt;div class="read v"&gt;&lt;span&gt;부피&lt;/span&gt;&lt;b id="volOut"&gt;100&lt;/b&gt;&lt;/div&gt;
    &lt;div class="read h"&gt;&lt;span&gt;1초당 손잡이 충돌 횟수&lt;/span&gt;&lt;b id="hitOut"&gt;0&lt;/b&gt;&lt;/div&gt;
    &lt;div class="read s"&gt;&lt;span&gt;입자의 평균 빠르기&lt;/span&gt;&lt;b id="spdOut"&gt;100&lt;/b&gt;&lt;/div&gt;
    &lt;div class="read p"&gt;&lt;span&gt;기체의 압력&lt;/span&gt;&lt;b id="prsOut"&gt;40&lt;/b&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class="tip"&gt;위·아래 벽은 상자를 좁히면 함께 짧아집니다. 그래서 길이가 변하지 않는
     &lt;b&gt;손잡이(오른쪽 벽)&lt;/b&gt;에 부딪히는 횟수만 세어야 공정하게 비교할 수 있습니다.&lt;/p&gt;
&lt;/div&gt;

&lt;script&gt;
const cv  = document.getElementById('box');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

/* ===== 값 설정 ===== */
const R     = 5;     // 입자 하나의 반지름(픽셀)
const SPEED = 2.6;   // 처음 나눠 주는 빠르기

let ps = [];
let playing  = true;
let vol      = 100;              // 부피(%)
let wallX    = W * vol / 100;    // 오른쪽 벽의 위치
let hitCount = 0;
let hitShow  = 0;
let lastSec  = performance.now();

/* 입자를 상자 안에 뿌린다 */
function makeParticles(n){
  ps = [];
  for(let i=0;i&lt;n;i++){
    const a = Math.random()*Math.PI*2;
    ps.push({
      x: R + Math.random()*(wallX-2*R),
      y: R + Math.random()*(H-2*R),
      vx: Math.cos(a)*SPEED,
      vy: Math.sin(a)*SPEED
    });
  }
}

/* 입자를 한 걸음 움직인다 */
function step(){
  for(const p of ps){
    p.x += p.vx;
    p.y += p.vy;

    if(p.x &lt; R    &amp;&amp; p.vx &lt; 0){ p.x = R;   p.vx = -p.vx; }  // 왼쪽 벽
    if(p.y &lt; R    &amp;&amp; p.vy &lt; 0){ p.y = R;   p.vy = -p.vy; }  // 위쪽 벽
    if(p.y &gt; H-R  &amp;&amp; p.vy &gt; 0){ p.y = H-R; p.vy = -p.vy; }  // 아래쪽 벽

    // 오른쪽 움직이는 벽 — 상자 안쪽에서 부딪힐 때
    if(p.x &lt; wallX &amp;&amp; p.x + R &gt; wallX &amp;&amp; p.vx &gt; 0){ p.x = wallX-R; p.vx = -p.vx; hitCount++; }
    // 오른쪽 움직이는 벽 — 상자 바깥쪽에서 부딪힐 때
    if(p.x &gt; wallX &amp;&amp; p.x - R &lt; wallX &amp;&amp; p.vx &lt; 0){ p.x = wallX+R; p.vx = -p.vx; }

    // 그림 밖으로 나가지 않게 막는다
    if(p.x &gt; W-R &amp;&amp; p.vx &gt; 0){ p.x = W-R; p.vx = -p.vx; }
  }
}

/* 입자의 평균 빠르기를 구한다 (처음 값이 100) */
function avgSpeed(){
  if(ps.length === 0) return 0;
  let s = 0;
  for(const p of ps) s += Math.hypot(p.vx, p.vy);
  return s / ps.length / SPEED * 100;
}

/* 기체의 압력을 구한다 */
function pressure(){
  return 40 / (vol/100);
}

/* 화살표 하나를 그린다 */
function arrow(x1,y1,x2,y2){
  const a = Math.atan2(y2-y1, x2-x1);
  ctx.strokeStyle = '#b23a30'; ctx.fillStyle = '#b23a30'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-8*Math.cos(a-0.42), y2-8*Math.sin(a-0.42));
  ctx.lineTo(x2-8*Math.cos(a+0.42), y2-8*Math.sin(a+0.42));
  ctx.closePath(); ctx.fill();
}

/* 화면을 그린다 */
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#e8eef3'; ctx.fillRect(0,0,W,H);           // 상자 바깥
  ctx.fillStyle = '#f4f9fd'; ctx.fillRect(0,0,wallX,H);       // 상자 안

  for(const p of ps){                                          // 입자
    ctx.beginPath(); ctx.arc(p.x,p.y,R,0,Math.PI*2);
    ctx.fillStyle = '#3a7a3f'; ctx.fill();
  }

  // 기체가 벽을 미는 힘 — 네 벽 모두
  for(let i=0;i&lt;4;i++){
    const y = H*(i+1)/5, x = wallX*(i+1)/5;
    arrow(26, y, 6, y);                 // 왼쪽
    arrow(wallX-26, y, wallX-6, y);     // 오른쪽
    arrow(x, 26, x, 6);                 // 위
    arrow(x, H-26, x, H-6);             // 아래
  }

  // 움직이는 벽(손잡이)
  ctx.fillStyle = '#8a5f24'; ctx.fillRect(wallX-6, 0, 12, H);
  ctx.fillStyle = '#c4711e'; ctx.fillRect(wallX-6, H/2-26, 12, 52);

  ctx.strokeStyle = '#1c507e'; ctx.lineWidth = 5;
  ctx.strokeRect(2.5, 2.5, wallX-5, H-5);
}

/* 되풀이해서 실행한다 */
function loop(now){
  if(playing) step();
  draw();

  if(now - lastSec &gt;= 1000){
    hitShow = hitCount; hitCount = 0; lastSec = now;
    document.getElementById('hitOut').textContent = hitShow;
  }
  document.getElementById('volOut').textContent = vol + '%';
  document.getElementById('spdOut').textContent = avgSpeed().toFixed(0);
  document.getElementById('prsOut').textContent = pressure().toFixed(0);

  requestAnimationFrame(loop);
}

/* 조작 단추 연결 */
const volEl = document.getElementById('vol');
const numEl = document.getElementById('num');

volEl.addEventListener('input', ()=&gt;{
  const before = wallX;
  vol   = +volEl.value;
  wallX = W * vol / 100;
  document.getElementById('volVal').textContent = vol + '%';

  // 상자가 좁아진 만큼 입자를 빠르게 한다
  const ratio = before / wallX;
  for(const p of ps){ p.vx *= ratio; p.vy *= ratio; }
});

numEl.addEventListener('input', ()=&gt;{
  document.getElementById('numVal').textContent = numEl.value;
  makeParticles(+numEl.value);
});

document.getElementById('play').addEventListener('click', e=&gt;{
  playing = !playing;
  e.target.textContent = playing ? '⏸ 멈춤' : '▶ 움직이기';
});
document.getElementById('reset').addEventListener('click', ()=&gt; makeParticles(+numEl.value));

makeParticles(+numEl.value);
requestAnimationFrame(loop);
&lt;/script&gt;

&lt;style&gt;

  .read.n b{color:var(--c4)} .read.s b{color:#7d5ba6}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class="wrap"&gt;
  &lt;h1&gt;데우는 상자&lt;/h1&gt;
  &lt;p class="sub"&gt;기체를 데우면 위에 얹힌 &lt;b&gt;뚜껑&lt;/b&gt;이 밀려 올라가 &lt;b&gt;부피&lt;/b&gt;가 어떻게 되는지 보여 줍니다.&lt;/p&gt;

  &lt;canvas id="box" width="520" height="380"&gt;&lt;/canvas&gt;

  &lt;div class="panel"&gt;
    &lt;div class="row"&gt;
      &lt;label for="temp"&gt;온도&lt;/label&gt;
      &lt;input type="range" id="temp" min="0" max="100" value="20"&gt;
      &lt;span class="val" id="tempVal"&gt;20℃&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class="row"&gt;
      &lt;button id="play"&gt;⏸ 멈춤&lt;/button&gt;
      &lt;button id="reset"&gt;↺ 처음으로&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class="reads"&gt;
    &lt;div class="read t"&gt;&lt;span&gt;온도&lt;/span&gt;&lt;b id="tOut"&gt;20&lt;/b&gt;&lt;/div&gt;
    &lt;div class="read v"&gt;&lt;span&gt;기체의 부피&lt;/span&gt;&lt;b id="vOut"&gt;50&lt;/b&gt;&lt;/div&gt;
    &lt;div class="read n"&gt;&lt;span&gt;입자 수&lt;/span&gt;&lt;b id="nOut"&gt;27&lt;/b&gt;&lt;/div&gt;
    &lt;div class="read s"&gt;&lt;span&gt;입자의 평균 빠르기&lt;/span&gt;&lt;b id="sOut"&gt;100&lt;/b&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
const cv  = document.getElementById('box');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

/* ===== 값 설정 ===== */
const SPEED   = 2.6;   // 20℃일 때의 빠르기
const ATM     = 0;     // 바깥 공기가 뚜껑을 누르는 정도
const PUSH_K  = 0.050; // 입자가 뚜껑을 밀어 올리는 정도
const DAMP    = 0.90;  // 뚜껑이 출렁이는 것을 가라앉히는 값
const TOP     = 34;    // 뚜껑이 올라갈 수 있는 가장 높은 곳
const BOTTOM  = H-40;  // 뚜껑이 내려갈 수 있는 가장 낮은 곳

let R       = 5;       // 입자 하나의 반지름(픽셀)
let temp    = 20;      // 온도(℃)
let ps      = [];
let playing = true;
let lidY    = H/2;     // 뚜껑의 높이
let lidV    = 0;       // 뚜껑이 움직이는 속도
let push    = 0;       // 입자가 뚜껑을 민 정도

/* 온도에 맞는 빠르기 */
function targetSpeed(t){
  return SPEED * Math.sqrt((t+273)/293);
}

/* 온도에 맞는 입자 수 */
function targetCount(t){
  return 20 + Math.round(t*0.35);
}

/* 온도에 맞는 입자 반지름 */
function targetRadius(t){
  return 4 + t*0.05;
}

/* 입자를 상자 안에 뿌린다 */
function makeParticles(n){
  const v = targetSpeed(temp);
  ps = [];
  for(let i=0;i&lt;n;i++){
    const a = Math.random()*Math.PI*2;
    ps.push({
      x: R + Math.random()*(W-2*R),
      y: lidY + R + Math.random()*(H-lidY-2*R),
      vx: Math.cos(a)*v,
      vy: Math.sin(a)*v
    });
  }
}

/* 온도를 바꾼다 */
function setTemp(t){
  temp = t;
  R = targetRadius(t);                       // 입자 크기를 맞춘다
  const want = targetCount(t);               // 입자 수를 맞춘다
  while(ps.length &gt; want) ps.pop();
  while(ps.length &lt; want){
    const a = Math.random()*Math.PI*2, v = targetSpeed(t);
    ps.push({ x: R+Math.random()*(W-2*R), y: lidY+R+Math.random()*(H-lidY-2*R),
              vx: Math.cos(a)*v, vy: Math.sin(a)*v });
  }
  const want_v = targetSpeed(t);             // 빠르기를 맞춘다
  const now_v  = avgSpeedRaw();
  if(now_v &gt; 0){
    const k = want_v / now_v;
    for(const p of ps){ p.vx *= k; p.vy *= k; }
  }
}

function avgSpeedRaw(){
  if(ps.length === 0) return 0;
  let s = 0;
  for(const p of ps) s += Math.hypot(p.vx, p.vy);
  return s / ps.length;
}

/* 입자와 뚜껑을 한 걸음 움직인다 */
function step(){
  push = 0;

  for(const p of ps){
    p.x += p.vx;
    p.y += p.vy;

    if(p.x &lt; R    &amp;&amp; p.vx &lt; 0){ p.x = R;   p.vx = -p.vx; }   // 왼쪽 벽
    if(p.x &gt; W-R  &amp;&amp; p.vx &gt; 0){ p.x = W-R; p.vx = -p.vx; }   // 오른쪽 벽
    if(p.y &gt; H-R  &amp;&amp; p.vy &gt; 0){ p.y = H-R; p.vy = -p.vy; }   // 바닥

    // 뚜껑 아래쪽에 부딪힌다
    if(p.y &lt; lidY + R &amp;&amp; p.vy &lt; 0){
      p.y  = lidY + R;
      p.vy = -p.vy;
      push += 2*Math.abs(p.vy);       // 뚜껑을 밀어 올린 정도를 모은다
    }
  }

  // 뚜껑 : 아래에서 입자가 밀어 올리고, 위에서 바깥 공기가 누른다
  lidV += push*PUSH_K - ATM;
  lidV *= DAMP;
  lidY -= lidV;

  if(lidY &lt; TOP)   { lidY = TOP;    lidV = 0; }
  if(lidY &gt; BOTTOM){ lidY = BOTTOM; lidV = 0; }

  for(const p of ps) if(p.y &lt; lidY + R) p.y = lidY + R;
}

/* 화면을 그린다 */
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#e8eef3'; ctx.fillRect(0,0,W,H);              // 뚜껑 위 바깥
  ctx.fillStyle = '#f4f9fd'; ctx.fillRect(0,lidY,W,H-lidY);      // 기체가 든 곳

  for(const p of ps){
    ctx.beginPath(); ctx.arc(p.x,p.y,R,0,Math.PI*2);
    ctx.fillStyle = '#3a7a3f'; ctx.fill();
  }

  ctx.fillStyle = '#8a5f24'; ctx.fillRect(0, lidY-13, W, 13);    // 뚜껑
  ctx.fillStyle = '#c4711e'; ctx.fillRect(W/2-34, lidY-20, 68, 8);

  ctx.strokeStyle = '#1c507e'; ctx.lineWidth = 5;                // 상자
  ctx.beginPath();
  ctx.moveTo(2.5, 0); ctx.lineTo(2.5, H-2.5);
  ctx.lineTo(W-2.5, H-2.5); ctx.lineTo(W-2.5, 0);
  ctx.stroke();

  // 불꽃 — 온도가 높을수록 크게
  const f = temp/100;
  ctx.fillStyle = 'rgba(196,113,30,' + (0.25+0.75*f) + ')';
  for(let i=0;i&lt;7;i++){
    const x = W*(i+1)/8, h = 6 + 22*f;
    ctx.beginPath();
    ctx.moveTo(x-7, H-3); ctx.quadraticCurveTo(x, H-3-h*1.7, x+7, H-3);
    ctx.fill();
  }
}

/* 되풀이해서 실행한다 */
function loop(){
  if(playing) step();
  draw();

  document.getElementById('tOut').textContent = temp;
  document.getElementById('vOut').textContent = Math.round((H-lidY)/H*100) + '%';
  document.getElementById('nOut').textContent = ps.length;
  document.getElementById('sOut').textContent = Math.round(avgSpeedRaw()/SPEED*100);

  requestAnimationFrame(loop);
}

/* 조작 단추 연결 */
const tempEl = document.getElementById('temp');
tempEl.addEventListener('input', ()=&gt;{
  document.getElementById('tempVal').textContent = tempEl.value + '℃';
  setTemp(+tempEl.value);
});
document.getElementById('play').addEventListener('click', e=&gt;{
  playing = !playing;
  e.target.textContent = playing ? '⏸ 멈춤' : '▶ 움직이기';
});
document.getElementById('reset').addEventListener('click', ()=&gt;{
  lidY = H/2; lidV = 0;
  tempEl.value = 20;
  document.getElementById('tempVal').textContent = '20℃';
  temp = 20; R = targetRadius(20);
  makeParticles(targetCount(20));
});

R = targetRadius(temp);
makeParticles(targetCount(temp));
requestAnimationFrame(loop);
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), msg.length > 28 ? 3200 : 1700);
}
function srcOf(id){ return document.getElementById(id).value; }
function copyText(txt, msg){
  const done = ()=> toast(msg || '복사했어요');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done, ()=>fallback());
  } else fallback();
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('복사가 안 돼요. 코드를 직접 긁어서 복사하세요'); }
    document.body.removeChild(ta);
  }
}
function openBlob(txt){
  const url = URL.createObjectURL(new Blob([txt], {type:'text/html;charset=utf-8'}));
  window.open(url, '_blank');
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
function download(txt, name){
  const url = URL.createObjectURL(new Blob([txt], {type:'text/html;charset=utf-8'}));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

const oneLine = s => s.trim().replace(/\s*\n\s*/g, ' ');
function fixRows(mid){
  const m = MISSIONS.find(x => x.id === mid), box = document.querySelector(`[data-fixbox="${mid}"]`);
  if(!box) return [];
  return m.bugs.map((b, i) => ({ i,
    on: box.querySelector(`[data-fixon="${mid}:${i}"]`).checked,
    found: oneLine(box.querySelector(`textarea[data-find="${mid}:${i}"]`).value),
    fix: oneLine(box.querySelector(`textarea[data-fix="${mid}:${i}"]`).value) })).filter(r => r.on && r.found);
}
function fixBody(rows){
  return '내가 찾은 잘못과 고칠 방법입니다.\n\n'
    + rows.map((r, k) => (k + 1) + '. 잘못: ' + r.found + '\n   고칠 방법: ' + (r.fix || '(아직 안 적었어요)')).join('\n')
    + '\n\n다른 부분은 그대로 두고, 내가 말한 곳만 고쳐 주세요.\n우리가 배운 말로만 쓰고, 계산식·어려운 낱말·처음 보는 단위나 내가 말하지 않은 기능은 넣지 마세요.';
}
function buildFix(mid){
  const el = document.querySelector(`[data-built="${mid}"]`); if(!el) return;
  const m = MISSIONS.find(x => x.id === mid), rows = fixRows(mid);
  el.classList.toggle('empty', !rows.length);
  el.textContent = rows.length ? m.intro + '\n' + fixBody(rows) : '찾은 잘못과 고칠 방법을 적으면 여기에 프롬프트가 만들어집니다.';
  document.querySelectorAll(`[data-fixon^="${mid}:"]`).forEach(c => c.closest('.fixrow').classList.toggle('off', !c.checked));
}

function drawFlow(scrollCur){
  const f = FLOW.find(x => x.no === flowStage) || FLOW[0];
  document.querySelectorAll('#stagepick button').forEach(b => { const n = +b.dataset.stage, lk = n > OPEN;
    b.classList.toggle('on', n === f.no); b.classList.toggle('lk', lk);
    const sm = b.querySelector('small'); const fs = FLOW.find(x => x.no === n); if(sm && fs) sm.textContent = (lk ? '🔒 ' : '') + fs.when; });
  if(f.no > OPEN && !document.body.classList.contains('tmode')){
    $('#flowbox').innerHTML = `<div class="card" style="border:2px dashed var(--c5);background:#f7f3fb"><b style="color:var(--c5)">🔒 ${f.no}단계 · ${f.t}</b> — ${f.when} 선생님이 열어 줍니다. 지금은 <b>${OPEN}단계</b>까지 할 수 있어요.</div>`;
    updateNow(); return;
  }
  FLOW.forEach(x => { const req = x.steps.filter(st => !st.opt), n = req.filter(st => flowDone[st.id]).length;
    const el = document.querySelector(`[data-pp="${x.no}"]`); if(el) el.textContent = n ? `${n}/${req.length} 마침` : ''; });
  const cur = curStep(f);
  $('#flowbox').innerHTML = `<div class="card fgoal"><b>${f.no}단계 · ${f.t}</b> <span>${f.when}</span><p style="margin:6px 0 0">${f.goal}</p></div>`

    + (cur ? '' : `<div class="card fend">${f.end}</div>`);
  if(scrollCur && cur){ const el = document.querySelector(`[data-fid="${cur.id}"]`); if(el) setTimeout(() => el.scrollIntoView({behavior:'smooth', block:'start'}), 60); }
  updateNow();
}
function updateNow(){
  const nb = $('#nowbar'); if(!nb) return;
  const f = FLOW.find(x => x.no === flowStage) || FLOW[0], cur = curStep(f);
  if(curTab === 'flow' || f.no > OPEN){ nb.hidden = true; return; }
  nb.hidden = false;
  if(!cur){ nb.innerHTML = `<span class="nb">🎉 <b>${f.no}단계</b>를 다 마쳤어요</span><button type="button" class="btn" data-gotab="flow">순서 보기</button>`; return; }
  const req = f.steps.filter(st => !st.opt);
  nb.innerHTML = `<span class="nb">📍 지금 할 일 · <b>${f.no}단계 ${req.indexOf(cur) + 1}/${req.length}</b> · ${cur.t}</span>`
    + (cur.tab && cur.tab !== curTab ? `<button type="button" class="btn pri" data-gotab="${cur.tab}">${tabLabel(cur.tab)} 열기</button>` : '')

}
function setDone(id, v){ if(v) flowDone[id] = true; else delete flowDone[id]; store.set(FLOW_KEY, flowDone); }
function wireFlow(){
  document.addEventListener('click', e => {
    const sb = e.target.closest('[data-stage]');
    if(sb){ flowStage = +sb.dataset.stage; store.set('flow:stage', flowStage); drawFlow(true); return; }
    const gt = e.target.closest('[data-gotab]');
    if(gt){ const id = gt.dataset.gotab; showTab(id); if(id === 'flow') drawFlow(true); else window.scrollTo({top:0, behavior:'smooth'}); return; }
    const fd = e.target.closest('[data-fdone]');
    if(fd){ setDone(fd.dataset.fdone, true); drawFlow(curTab === 'flow');
      const nx = curStep(FLOW.find(x => x.no === flowStage) || FLOW[0]);
      toast(nx ? '다음: ' + nx.t : '이 단계를 다 마쳤어요!'); return; }
    const fu = e.target.closest('[data-fundo]');
    if(fu){ setDone(fu.dataset.fundo, false); drawFlow(); return; }
    const ft = e.target.closest('[data-ftoggle]');
    if(ft) ft.closest('.fstep').classList.toggle('open');
  });
  drawFlow();
}
function applyLocks(){
  document.querySelectorAll('nav.tabs button').forEach(b => { const st = TAB_STAGE[b.dataset.tab]; if(!st) return;
    const t = TABS.find(x => x.id === b.dataset.tab); b.textContent = (st > OPEN ? '🔒 ' : '') + t.label; });

  drawFlow();
}
async function loadOpen(){
  if(/\/share\//.test(location.pathname)) return;
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 5000);
    const r = await fetch(SB_URL + '/rest/v1/rpc/sgh_task', { method:'POST', signal:ctl.signal,
      headers:{ apikey:SB_KEY, Authorization:'Bearer ' + SB_KEY, 'Content-Type':'application/json' }, body:JSON.stringify({ p_code:'gas' }) });
    if(!r.ok) return;
    const j = await r.json(), n = +(j && j.open_stage);
    if(n >= 1 && n <= 4 && n !== OPEN){ OPEN = n; applyLocks(); }
  } catch(e) { /* 못 읽으면 기본(2단계까지) */ }
}

function wire(){
  // 결함 카드 펼치기 / 체크
  document.querySelectorAll('.bug').forEach(bug => {
    const chk = bug.querySelector('.chk');
    const idx = +bug.dataset.bug.split('-')[1];
    const mid = bug.dataset.bug.split('-')[0];
    bug.querySelector('.head').addEventListener('click', e => {
      if(e.target.closest('.found')) return;
      bug.classList.toggle('open');
    });
    const sync = () => bug.classList.toggle('done', chk.checked);
    chk.checked = store.get('bug:'+mid+':'+idx, false);
    chk.addEventListener('change', () => { store.set('bug:'+mid+':'+idx, chk.checked); sync(); updateProgress(); });
    sync();
  });

  // 먼저 생각해 보기 — 모형이 갖춰야 할 조건을 적어야 「보여 줘야 하는 것」이 열린다(이 기기에만)
  document.querySelectorAll('textarea[data-cond]').forEach(t => {
    t.value = store.get('cond:' + t.dataset.cond, '');
    t.addEventListener('input', () => store.set('cond:' + t.dataset.cond, t.value));
  });
  const openGoal = (mid, on) => {
    const g = document.querySelector(`[data-goal="${mid}"]`), l = document.querySelector(`[data-goallock="${mid}"]`), b = document.querySelector(`[data-condopen="${mid}"]`);
    if(g) g.hidden = !on;
    if(l) l.hidden = on;
    if(b){ b.disabled = on; b.textContent = on ? '✓ 열렸어요 — 아래에서 내 생각과 견주어 보세요' : b.dataset.label; }
  };
  document.querySelectorAll('[data-condopen]').forEach(b => {
    b.dataset.label = b.textContent;
    const mid = b.dataset.condopen;
    openGoal(mid, store.get('condopen:' + mid, false));
    b.addEventListener('click', () => {
      const t = document.querySelector(`textarea[data-cond="${mid}"]`);
      if(t.value.replace(/\s/g, '').length < 6){ toast('내 생각을 한 문장 이상 적어 주세요'); t.focus(); return; }
      store.set('condopen:' + mid, true); openGoal(mid, true);
      setTimeout(() => document.querySelector(`[data-goal="${mid}"]`).scrollIntoView({behavior:'smooth', block:'start'}), 80);
    });
  });

  // 잘못 찾기 — 적은 것은 이 기기에 저장, 다 적으면 정답 공개. 3단계 ⓑ의 같은 칸과 함께 바뀐다
  const finds = document.querySelectorAll('textarea[data-find]');
  finds.forEach(t => {
    t.value = store.get('find:' + t.dataset.find, '');
    t.addEventListener('input', () => {
      store.set('find:' + t.dataset.find, t.value);
      finds.forEach(o => { if(o !== t && o.dataset.find === t.dataset.find) o.value = t.value; });
      buildFix(t.dataset.find.split(':')[0]);
    });
  });

  // 3단계 ⓑ 직접 고치기 — 찾은 잘못 + 고칠 방법으로 프롬프트를 만든다
  document.querySelectorAll('[data-fixon]').forEach(c => {
    c.checked = store.get('fixon:' + c.dataset.fixon, true);
    c.addEventListener('change', () => { store.set('fixon:' + c.dataset.fixon, c.checked); buildFix(c.dataset.fixon.split(':')[0]); });
  });
  document.querySelectorAll('textarea[data-fix]').forEach(t => {
    t.value = store.get('fix:' + t.dataset.fix, '');
    t.addEventListener('input', () => { store.set('fix:' + t.dataset.fix, t.value); buildFix(t.dataset.fix.split(':')[0]); });
  });
  MISSIONS.forEach(m => buildFix(m.id));
  document.querySelectorAll('[data-fixcopy]').forEach(b => b.addEventListener('click', () => {
    const mid = b.dataset.fixcopy, m = MISSIONS.find(x => x.id === mid), rows = fixRows(mid);
    if(!rows.length){ toast('넣을 잘못이 없어요 — 찾은 잘못을 적고 「넣기」를 체크하세요'); return; }
    const miss = rows.find(r => !r.fix);
    if(miss){
      toast('「이렇게 고쳐 주세요」 칸을 채워 주세요 (찾은 잘못 ' + (miss.i + 1) + ')');
      document.querySelector(`[data-fixbox="${mid}"] textarea[data-fix="${mid}:${miss.i}"]`).focus(); return;
    }
    const withCode = b.dataset.withcode === '1';
    copyText(withCode ? m.intro + '\n' + fixBody(rows) + '\n\n' + srcOf(m.src) : '방금 고친 시뮬레이터에서 이어서 고쳐 주세요.\n' + fixBody(rows),
      withCode ? '프롬프트와 코드를 함께 복사했어요. 새 채팅(Canvas) 입력칸에 Ctrl+V 하세요' : '프롬프트를 복사했어요. 같은 대화 입력칸에 Ctrl+V 하세요');
  }));
  const reveal = (mid, on) => {
    const box = document.querySelector(`[data-bugs="${mid}"]`), b = document.querySelector(`[data-reveal="${mid}"]`);
    if(box) box.hidden = !on;
    if(b){ b.disabled = on; b.textContent = on ? '✓ 공개했어요 — 아래에서 견주어 보세요' : b.dataset.label; }
  };
  document.querySelectorAll('[data-reveal]').forEach(b => {
    b.dataset.label = b.textContent;
    const mid = b.dataset.reveal;
    reveal(mid, store.get('reveal:' + mid, false));
    b.addEventListener('click', () => {
      const wrote = [...document.querySelectorAll(`textarea[data-find^="${mid}:"]`)].some(t => t.value.trim());
      if(!wrote && !confirm('아직 하나도 적지 않았어요. 그래도 정답을 공개할까요?')) return;
      store.set('reveal:' + mid, true); reveal(mid, true);
      setTimeout(() => document.querySelector(`[data-bugs="${mid}"]`).scrollIntoView({behavior:'smooth', block:'start'}), 80);
    });
  });

  // 생각해 보기 — 쓰기만 하고 내지 않는다(이 기기에만)
  document.querySelectorAll('textarea[data-think]').forEach(t => {
    t.value = store.get('think:' + t.dataset.think, '');
    t.addEventListener('input', () => store.set('think:' + t.dataset.think, t.value));
  });

  // 확인 목록
  document.querySelectorAll('.chks input[data-key]').forEach(el => {
    el.checked = store.get(el.dataset.key, false);
    el.closest('li').classList.toggle('done', el.checked);
    el.addEventListener('change', () => {
      store.set(el.dataset.key, el.checked);
      el.closest('li').classList.toggle('done', el.checked);
      updateProgress();
    });
  });

  // 코드 단추
  document.querySelectorAll('[data-copy]').forEach(b =>
    b.addEventListener('click', () => copyText(srcOf(b.dataset.copy), '코드를 복사했어요. AI에게 붙여넣으세요')));
  document.querySelectorAll('[data-open]').forEach(b =>
    b.addEventListener('click', () => openBlob(srcOf(b.dataset.open))));
  document.querySelectorAll('[data-dl]').forEach(b =>
    b.addEventListener('click', () => download(srcOf(b.dataset.dl), b.dataset.name)));
  document.querySelectorAll('[data-copytext]').forEach(b =>
    b.addEventListener('click', () => copyText(
      document.getElementById('ptxt-'+b.dataset.copytext).textContent.trim(), '문장을 복사했어요')));
  document.querySelectorAll('[data-copyboth]').forEach(b => b.addEventListener('click', () => {
    const m = MISSIONS.find(x => x.id === b.dataset.copyboth);
    copyText(m.prompt + '\n\n' + srcOf(m.src), '문장과 코드를 함께 복사했어요. 제미나이 입력칸에 Ctrl+V 하세요');
  }));
  // 실행실 — 제미나이에서 코드 복사하는 법 펼치기
  document.querySelectorAll('[data-howcopy]').forEach(b => b.addEventListener('click', () => {
    const box = document.querySelector(`[data-howbox="${b.dataset.howcopy}"]`);
    box.hidden = !box.hidden; b.setAttribute('aria-expanded', String(!box.hidden));
    b.textContent = (box.hidden ? '📖 제미나이에서 코드 복사하는 법 보기' : '📖 코드 복사하는 법 접기');
  }));

  // 실행실
  MISSIONS.forEach(m => {
    const ta  = document.querySelector(`textarea[data-lab="${m.id}"]`);
    const box = document.querySelector(`[data-labbox="${m.id}"]`);
    const fr  = document.querySelector(`iframe[data-labframe="${m.id}"]`);
    ta.value = store.get('lab:'+m.id, '');
    ta.addEventListener('input', () => store.set('lab:'+m.id, ta.value));

    document.querySelector(`[data-run="${m.id}"]`).addEventListener('click', () => {
      const code = ta.value.trim();
      if(!code){ toast('먼저 코드를 붙여넣으세요'); return; }
      box.style.display = 'block';
      fr.srcdoc = code;
      toast('실행했어요');
      setTimeout(() => box.scrollIntoView({behavior:'smooth', block:'center'}), 90);
    });
    document.querySelector(`[data-labcopy="${m.id}"]`).addEventListener('click', () => {
      const code = ta.value.trim();
      if(!code){ toast('복사할 코드가 없어요'); return; }
      copyText(code, '내 코드를 복사했어요. Studentgithub 제출의 앱 코드 칸에 붙여넣으세요');
    });
    document.querySelector(`[data-labdl="${m.id}"]`).addEventListener('click', e => {
      const code = ta.value.trim();
      if(!code){ toast('저장할 코드가 없어요'); return; }
      download(code, e.target.dataset.name);
    });
    document.querySelector(`[data-labclear="${m.id}"]`).addEventListener('click', () => {
      ta.value = ''; store.set('lab:'+m.id, ''); box.style.display = 'none';
      fr.removeAttribute('srcdoc'); toast('지웠어요');
    });
  });

  // 불량 코드 불러오기 (선생님 보기 — AI 없이 코드를 직접 고칠 때)
  document.querySelectorAll('[data-labload]').forEach(b => b.addEventListener('click', () => {
    const m = MISSIONS.find(x => x.id === b.dataset.labload);
    const ta = document.querySelector(`textarea[data-lab="${m.id}"]`);
    if(ta.value.trim() && !confirm('실행실에 있는 코드를 불량 코드로 바꿀까요?')) return;
    ta.value = srcOf(m.src); store.set('lab:'+m.id, ta.value);
    toast('불량 코드를 불러왔어요. 잘못 카드의 「코드에서 고칠 곳」을 보고 고칩니다');
    ta.focus(); ta.setSelectionRange(0, 0); ta.scrollTop = 0;
  }));

  // Studentgithub 주소
  document.querySelectorAll('[data-sgh]').forEach(a => { a.href = SGH_URL; a.target = '_blank'; a.rel = 'noopener'; });

  // 모형 이야기: 한계 체크와 확인 문제
  document.querySelectorAll('input[data-lim]').forEach(el => {
    el.checked = store.get('lim:'+el.dataset.lim, false);
    el.closest('li').classList.toggle('done', el.checked);
    el.addEventListener('change', () => { store.set('lim:'+el.dataset.lim, el.checked); el.closest('li').classList.toggle('done', el.checked); });
  });
  document.querySelectorAll('.mq').forEach(q => q.addEventListener('click', e => {
    const b = e.target.closest('.mqc button'); if(!b || q.classList.contains('done')) return;
    const i = [...q.querySelectorAll('.mqc button')].indexOf(b);
    if(i === +q.dataset.a){ b.classList.add('ok'); q.classList.add('done'); }
    else { b.classList.add('no'); setTimeout(() => b.classList.remove('no'), 700); }
  }));

  // 교사 모드
  const tb = $('#tmodeBtn');
  const setT = on => { document.body.classList.toggle('tmode', on); tb.classList.toggle('on', on); store.set('tmode', on); };
  setT(store.get('tmode', false));
  tb.addEventListener('click', () => { setT(!document.body.classList.contains('tmode')); drawFlow(); });

  wireFlow();
  applyLocks();
  loadOpen();
}

/* ══════════════════ 시작 ══════════════════ */
countTotal();
buildTabs();
buildMain();
wire();
updateProgress();
showTab(startTab());
</script>
</body>
</html>
